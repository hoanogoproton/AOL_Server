server:
  host: "127.0.0.1"
  port: 8182

storage:
  base_dir: "./data/test_ng"
  raw_dir: "./data/test_ng/raw"
  annotated_dir: "./data/test_ng/annotated"
  database_path: "./data/test_ng/inspection.db"

model:
  weights: "./models/AOLv2.pt"
  device: cpu
  imgsz: 1280
  min_predict_confidence: 0.4
  iou_threshold: 0.45

image:
  expected_width: 1600
  expected_height: 1200
  reject_wrong_resolution: true

roi:
  # Step 1 cho phep anh rong PASS; Step 3 yeu cau >= 1 san pham OK
  # -> anh den (0 detection) se NG o Step 3 -> kich ban gui tin hieu '0'.
  csv_path: "./tests/roi_rules_ng_test.csv"
  bbox_rule: "center_inside_roi"

sequence:
  server_cycle_timeout_sec: 120

serial:
  # Don gian: Step 3 NG -> gui ky tu '0' qua COM. Khong ACK, khong CRC.
  # Test de enabled: false -> chi log "Skip NG signal (simulate sent)".
  enabled: false
  port: "COM3"
  baudrate: 115200
  retry_count: 3           # so lan gui lai khi port COM loi
  retry_interval_sec: 0.2  # nghi giua cac lan retry (giay)

client:
  host: "127.0.0.1"
  port: 8182

system:
  worker_count: 1

camera_agent:
  agent:
    agent_id: "TESTNG"
    root_path: "./data/test_ng/watch"
    network_share: null
    poll_interval_sec: 0.5
    bootstrap_mode: "start_from_now"
    file_stable_sec: 0.3
    file_check_interval_sec: 0.1
    reconcile_interval_sec: 5
    step_timeout_sec: 500
    cycle_timeout_sec: 1800
    auto_recover_out_of_sync: true
    auto_reset_on_startup: true

  storage:
    database_path: "./data/test_ng/agent/camera_agent.db"
    log_dir: "./data/test_ng/agent/logs"

  ai_server:
    base_url: "http://127.0.0.1:8182"
    upload_timeout_sec: 15
    retry_interval_sec: 1

  local_api:
    host: "127.0.0.1"
    port: 8182
