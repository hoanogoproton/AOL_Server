server:
  host: "0.0.0.0"
  port: 8080
  # Sau khi server khoi chay thanh cong (/health tra 200) se TU MO TRINH
  # DUYET trang Web UI localhost (http://127.0.0.1:8080/). Luon mo qua
  # 127.0.0.1 ke ca khi host = 0.0.0.0. Neu server chua song sau 60 giay
  # (boot loi / port bi chiem) -> bo qua, khong mo trang loi.
  # TAT nhanh bang env: AI_OPEN_BROWSER=0
  open_browser: true

storage:
  base_dir: "./data"
  raw_dir: "./data/raw"
  annotated_dir: "./data/annotated"
  database_path: "./data/inspection.db"

  # ==========================================================
  # THU MUC LUU KET QUA NG: anh NG + file log STEP3 (CSV).
  # Co the tro vao network share (UNC path) — nen dung NHAY DON
  # de dau '\' giu nguyen (giong cach viet username o duoi):
  #   ng_dir: '\\172.17.108.168\Anh AOL NG'
  # Cau truc tu tao ben trong thu muc nay:
  #   <ng_dir>/<cycle_id>/<ten_anh>_annotated.jpg   (anh NG da annotate)
  #   <ng_dir>/<cycle_id>/<ten_anh>.jpg             (anh NG raw - ban goc)
  #   <ng_dir>/logs/STEP3_log_YYYY-MM-DD.csv        (file log Step 3)
  # CHINH SACH LUU ANH: moi anh (OK + NG) deu luu local nhu cu; qua
  #   'image_retention_days' ngay, thread cleanup se TU DONG XOA anh
  #   cu tren local (raw_dir + annotated_dir). Ban sao anh NG + raw
  #   NG + log da duoc ghi KEP len share nay nen khong mat bang
  #   chung NG. Log CSV khong bao gio bi xoa tu dong.
  # Neu xoa muc nay hoac de gia tri rong -> ve mac dinh nhu cu:
  #   anh NG: <base_dir>/ng  ,  file log: <base_dir>/logs
  # LUU Y: may chay server phai co quyen GHI vao share nay
  #   (net use truoc, hoac share cho phep ghi). Neu share khong
  #   truy cap duoc khi khoi dong, server tu fallback ve thu muc
  #   local (<base_dir>/ng) va ghi loi vao log - khong bi chet.
  # ==========================================================
  ng_dir: '\\172.17.108.168\Anh AOL NG'

  # So ngay giu anh tren may local truoc khi tu dong xoa (raw +
  # annotated, ca OK lan NG). 0 = tat don dep (giu mai mai).
  image_retention_days: 1

model:
  classifiers:
    BODY:
      weights: "./models/AOL-Body.pt"
    END:
      weights: "./models/AOL-End.pt"
    HEAD:
      weights: "./models/AOL-Head.pt"
  device: cpu                 # GPU đầu tiên. Dùng "cpu" nếu không có GPU.
  classifier_imgsz: 224

image:
  expected_width: 1600
  expected_height: 1200
  reject_wrong_resolution: true

roi:
  csv_path: "./roi_rules.csv"
  bbox_rule: "center_inside_roi"

sequence:
  # Nếu Step 1 đã đến mà không có Step 3 sau thời gian này:
  # server sẽ kết luận NG để fail-safe.
  # Phải CAO HƠN cycle_timeout_sec của agent (1800s) một biên độ:
  # fail-safe dài hạn do agent E204 đảm nhiệm (abort đúng No bị kẹt,
  # không lan sang No khác). 1900 > 1800 tránh 2 cơ chế đua nhau NG.
  server_cycle_timeout_sec: 1900

serial:
  enabled: true
  port: "COM12"
  baudrate: 9600
  retry_count: 3
  retry_interval_sec: 0.2

  # Kiem tra COM ngay khi khoi dong, truoc khi load model.
  # Chi doc thong bao san sang, KHONG gui lenh bat relay.
  startup_timeout_sec: 8.0
  ready_message: "Arduino san sang"

  # false: COM loi -> web van chay, /health hien loi, NG sau thu ket noi lai.
  # true: COM/Arduino chua san sang -> dung khoi dong server.
  startup_required: false

  # Xac nhan Arduino da xu ly lenh NG (khong phai cam bien trang thai relay).
  ack_timeout_sec: 3.0
  ack_message: "NHAN 0 - RELAY KICH HOAT"

  # Gui 1 lenh moi NG; relay giu bat theo logic sketch Arduino.
  ng_signal_duration_sec: 0.5
  ng_signal_interval_sec: 0.5

# ============================================================
# MERGED MODE: webhook Step 1 FAIL gửi về Camera Agent
# đang chạy trong CÙNG process -> loopback qua chính server.
# ============================================================
client:
  host: "127.0.0.1"
  port: 8080

system:
  worker_count: 1

# ============================================================
# CAMERA AGENT (chạy chung 1 process với AI Server - merged mode)
# ============================================================
camera_agent:
  agent:
    agent_id: "CAM01"

    # Chỉ dùng khi TẮT network_share ở dưới (đọc thư mục local).
    root_path: "D:\\JPG1"

    # ==========================================================
    # SHARE MẠNG TỪ MÁY KHÁC (BẬT: đọc ảnh qua network share)
    # Nếu có mục này: root_path phía trên bị BỎ QUA, agent tự
    #   trỏ tới: \\<host>\<share>\<subfolder>
    #   và tự đăng nhập bằng username/password khi khởi động
    #   (không cần chạy tay 'net use').
    # Muốn quay lại đọc thư mục local: xóa mục network_share
    #   hoặc đặt network_share: null.
    # LƯU Ý: password lưu plaintext -> hạn chế quyền đọc file
    #   config bằng NTFS ACL (chỉ tài khoản chạy Agent được đọc).
    # ==========================================================
    network_share: null


    # Chu ky quet (giay) cua Smart Poller tren share mang / UNC
    # (hoac cua PollingObserver neu smart_poller: false). Voi
    # smart poller, chi phi moi chu ky KHONG phu thuoc tong du
    # lieu tren share nen 2s van rat nhe.
    poll_interval_sec: 2.0

    # ======================================================
    # SMART POLLER - khac phuc agent "dung" khi share co
    # hang tram GB / hang chuc folder: thay vi PollingObserver
    # quet TOAN BO cay thu muc moi chu ky (nguyen nhan he
    # thong dung), poller chi:
    #   - stat tung folder da biet (re),
    #   - quet sau folder MOI / DOI (mtime doi) / folder nho,
    #   - khong bao gio quet lai du lieu lich su khong doi.
    # Baseline theo ton-tai-khi-quet-lan-dau tung folder: LAN DAU
    # quet mot folder, toan bo file dang ton tai duoc coi la "da
    # xu ly" (khong emit gi, bat ke mtime); cac lan sau chi emit
    # file moi hoac bi ghi de sau baseline. Du lieu cu tren share
    # khong bi xu ly lai va KHONG phu thuoc lech gio giua cac may,
    # server khoi dong ngay lap tuc (khong quet toan cay share
    # khi start).
    # Dat false de quay lai PollingObserver quet toan cay (cu).
    # ======================================================
    smart_poller: true

    # Gioi han so thu muc quet sau moi chu ky de 1 chu ky khong
    # bao gio qua lau; thu muc con lai quet o chu ky ke tiep.
    max_dir_scans_per_cycle: 32

    # DEPRECATED - khong con dung (giu lai de config cu khong bi
    # loi). Truoc day day la bu lech gio giua may Agent va may chu
    # share de loc anh theo mtime. Gio poller baseline theo
    # ton-tai-khi-quet-lan-dau tung folder (khong loc theo mtime)
    # nen lech gio may chu share khong con anh huong: gia tri nay
    # bi bo qua, chi duoc log lai mot lan khi khoi dong neu khac 0.
    start_grace_sec: 7500

    # ======================================================
    # THEO DOI FOLDER NGAY HIEN TAI + HOM QUA (smart poller).
    # Quet root chi nhan entry ten trung ngay hom nay HOAC hom qua
    # theo 'day_folder_format' (vd 2026-09-11 + 2026-09-10), bo qua
    # toan bo folder ngay lich su khac. Folder hom qua duoc giu de
    # bu lech gio giua may chu share va may Agent: khi gio may
    # camera cham hon, vua sau nua dem cua Agent camera van ghi vao
    # folder ngay cu trong vai gio - khong track hom qua thi se
    # MAT anh trong khung nay. Nua dem tu rollover: chi don state
    # folder TRUOC hom qua, khong can restart. Tat di (false) de
    # quay lai theo doi toan cay.
    # LUU Y: folder ngay phai nam ngay duoi root; gio may Agent
    # lam chuan khi quyet dinh folder nao duoc theo doi. Lan quet
    # dau tung folder chi lap baseline (khong emit file cu) - chi
    # anh ghi vao SAU baseline moi duoc xu ly.
    # ======================================================
    watch_current_day: true
    day_folder_format: "%Y-%m-%d"

    # Chot "anh dang ton tai tai luc start = da xu ly" o moi LAN
    # khoi dong. Legacy (root local / smart_poller: false): moi lan
    # start deu quet danh sach file hien co duoi root (chi stat,
    # khong doc noi dung) va danh dau BOOTSTRAP_IGNORED de
    # reconcile_loop khong re-add. Khi smart poller bat: khong quet
    # - poller tu lap baseline tung folder khi quet lan dau.
    bootstrap_mode: "start_from_now"

    # File phải giữ nguyên dung lượng ít nhất khoảng thời gian này
    # mới được coi là ghi hoàn tất.
    file_stable_sec: 0.5

    # Chu kỳ kiểm tra candidate file.
    file_check_interval_sec: 0.2

    # Quet lai toan bo thu muc anh de bu event watcher bi mat.
    # CHI ap dung khi smart_poller: false. Khi smart poller bat,
    # vong quet toan cay nay tu VO HIEU (no tu bu event theo tung
    # folder, khong ton SMB quet lai hang tram GB moi 10 giay).
    reconcile_interval_sec: 10

    # Ngưỡng cảnh báo: nếu chờ ảnh tiếp theo quá lâu, chỉ log WARNING,
    # không thay đổi trạng thái stream.
    step_timeout_sec: 500

    # Ngưỡng hard-abort: nếu quá lâu không có ảnh kế tiếp, cycle bị
    # abort (E204) và stream chuyển OUT_OF_SYNC. Phải lớn hơn mọi
    # khoảng nghỉ bình thường của máy (kể cả ranh giới giờ / đổi ca).
    cycle_timeout_sec: 1800

    # Nếu true: ảnh hợp lệ kế tiếp sẽ tự reset stream OUT_OF_SYNC thành
    # READY_STEP1 (không cần reset tay).
    auto_recover_out_of_sync: true

    # Không còn dùng: agent luôn khôi phục hàng đợi và ảnh đang chờ
    # kết quả khi khởi động lại (không xoá state). Giữ để tương thích.
    auto_reset_on_startup: true

  storage:
    database_path: "./data/agent/camera_agent.db"
    log_dir: "./data/agent/logs"

  # Agent upload ảnh về chính AI Server trong cùng process (loopback).
  ai_server:
    base_url: "http://127.0.0.1:8080"
    upload_timeout_sec: 15
    retry_interval_sec: 2

  # Không còn dùng (agent không mở port riêng nữa) - giữ để tương thích.
  local_api:
    host: "127.0.0.1"
    port: 8080
