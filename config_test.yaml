server:
  host: "127.0.0.1"
  port: 8180

storage:
  base_dir: "./data/test"
  raw_dir: "./data/test/raw"
  annotated_dir: "./data/test/annotated"
  database_path: "./data/test/inspection.db"

model:
  weights: "./models/AOLv2.pt"
  device: cpu
  imgsz: 1280
  min_predict_confidence: 0.4
  iou_threshold: 0.45

image:
  expected_width: 1600
  expected_height: 1200
  reject_wrong_resolution: true

roi:
  # Rule test: ảnh rỗng (0 detection) vẫn PASS mọi ROI.
  csv_path: "./roi_rules_test_pass.csv"
  bbox_rule: "center_inside_roi"

sequence:
  server_cycle_timeout_sec: 120

serial:
  enabled: false
  port: "COM3"
  baudrate: 115200
  read_timeout_sec: 0.1
  ack_timeout_sec: 0.5
  retry_count: 3
  retry_interval_sec: 0.2

client:
  host: "127.0.0.1"
  port: 8180

system:
  com_retry_interval_sec: 2
  worker_count: 1

# Camera Agent chạy merged, đọc thư mục LOCAL (không dùng share) cho test.
camera_agent:
  agent:
    agent_id: "TEST01"
    root_path: "./data/test/watch"
    network_share: null
    poll_interval_sec: 0.5
    bootstrap_mode: "start_from_now"
    file_stable_sec: 0.3
    file_check_interval_sec: 0.1
    reconcile_interval_sec: 5
    step_timeout_sec: 500
    cycle_timeout_sec: 1800
    auto_recover_out_of_sync: true
    auto_reset_on_startup: true

  storage:
    database_path: "./data/test/agent/camera_agent.db"
    log_dir: "./data/test/agent/logs"

  ai_server:
    base_url: "http://127.0.0.1:8180"
    upload_timeout_sec: 15
    retry_interval_sec: 1

  local_api:
    host: "127.0.0.1"
    port: 8180